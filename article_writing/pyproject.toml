[project]
name = "article-writing"
version = "0.1.0"
description = "BioFLow plate 3: section-wise scientific article drafting"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["article_writing*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
